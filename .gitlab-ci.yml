# ---------------------------------------------------------------------------
# atropos-go GitLab CI/CD Pipeline
#
# Stages:
#   check   — Go build, vet, fmt, test, race detection
#   release — Manual version tagging on main / alpha on develop
#
# Required CI/CD variables (Settings > CI/CD > Variables):
#   RELEASE_PUSH_TOKEN   — Project access token, write_repository scope.
#                          Used by release-tag and release-alpha to push the
#                          newly-created tag back to origin. Mark as Protected
#                          + Masked. Role must satisfy any Protected-Tags rule
#                          on `v*` (typically Developer; Maintainer if the
#                          protection is restricted to maintainers only).
# ---------------------------------------------------------------------------

stages:
  - check
  - release

# ---------------------------------------------------------------------------
# Go verification
# ---------------------------------------------------------------------------

.go-base:
  image: golang:1.27

go-verify:
  extends: .go-base
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - |
      unformatted=$(gofmt -l .)
      if [ -n "$unformatted" ]; then
        echo "These files need gofmt:"
        echo "$unformatted"
        exit 1
      fi
    - go vet ./...
    - go build ./...
    - go test -count=1 ./...

go-race:
  extends: .go-base
  stage: check
  variables:
    CGO_ENABLED: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - go test -race -count=1 ./...

go-integration:
  extends: .go-base
  stage: check
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  before_script:
    - git clone --depth 1 --branch develop
        https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/microfaults/manteion-go.git
        ../manteion-go
  script:
    - go build ./...
    - go test -count=1 ./...
    - cd ../manteion-go
    - go build ./...

# OpenAPI spec freshness gate.
openapi-check:
  stage: check
  image: golang:1.27
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-yaml
    - go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc6
    - export PATH=$PATH:$(go env GOPATH)/bin
  script:
    - make openapi-check

# ---------------------------------------------------------------------------
# Release — manual version tagging
# ---------------------------------------------------------------------------

release-tag:
  stage: release
  image: alpine:3.22
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -z "$RELEASE_PUSH_TOKEN" ]; then
        echo "ERROR: RELEASE_PUSH_TOKEN is not set. See header for setup." >&2
        exit 1
      fi
      git remote set-url origin "https://oauth2:${RELEASE_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      LATEST=$(git tag --sort=-version:refname | head -1)
      if [ -z "$LATEST" ]; then
        LATEST="v0.0.0"
      fi
      MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
      MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
      PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3 | cut -d- -f1)
      NEXT_PATCH=$((PATCH + 1))
      NEW_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}"
      echo "Latest tag: $LATEST"
      echo "New tag: $NEW_TAG"
      git tag "$NEW_TAG"
      git push origin "$NEW_TAG"
      echo "TAG=$NEW_TAG" >> release.env
  artifacts:
    reports:
      dotenv: release.env

release-alpha:
  stage: release
  image: alpine:3.22
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -z "$RELEASE_PUSH_TOKEN" ]; then
        echo "ERROR: RELEASE_PUSH_TOKEN is not set. See header for setup." >&2
        exit 1
      fi
      git remote set-url origin "https://oauth2:${RELEASE_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      LATEST=$(git tag --sort=-version:refname | grep -v alpha | head -1)
      if [ -z "$LATEST" ]; then
        LATEST="v0.0.0"
      fi
      MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
      MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
      PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3 | cut -d- -f1)
      NEXT_PATCH=$((PATCH + 1))
      SHORT_SHA=$(git rev-parse --short HEAD)
      NEW_TAG="v${MAJOR}.${MINOR}.${NEXT_PATCH}-alpha.${SHORT_SHA}"
      echo "Latest stable tag: $LATEST"
      echo "New alpha tag: $NEW_TAG"
      git tag "$NEW_TAG"
      git push origin "$NEW_TAG"
      echo "TAG=$NEW_TAG" >> release.env
  artifacts:
    reports:
      dotenv: release.env
